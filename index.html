<script>
/* GitHub 화면 전용: google.script.run 을 Apps Script 서버 호출(fetch)로 바꾼다. 서버 주소(api)·암호(k)는 처음 받은 링크로 한 번 열면 이 기기에 기억된다 (1025 리뉴얼에도 그대로) */
(function () {
  if (window.google && window.google.script) return;
  var DEFAULT_API = 'https://script.google.com/macros/s/AKfycbxQSU5efF__vOXzOgF3W6q5GlxuWxIejzksuhUjnHTSj31Uz1x6A5y_s3svLcG16Ibh/exec';   /* 배포 주소 (암호 없이는 아무것도 안 알려줌) */
  var q = new URLSearchParams(location.search), api = q.get('api') || '', k = q.get('k') || '';
  try {
    if (api) localStorage.setItem('bb_api', api); else api = localStorage.getItem('bb_api') || '';
    if (!api || /\/dev$/.test(api)) { api = DEFAULT_API; localStorage.setItem('bb_api', api); }
    if (k) localStorage.setItem('bb_k', k); else k = localStorage.getItem('bb_k') || '';
    if (q.get('api') || q.get('k')) history.replaceState(null, '', location.pathname);   /* 주소창에서 암호 숨기기 */
  } catch (e) {}
  function send(fn, args, ok, fail) {
    if (!k) { showSetup(); fail && fail(new Error('설정 필요')); return; }
    var ac = new AbortController(), to = setTimeout(function () { ac.abort(); }, 15000);
    fetch(api, { method: 'POST', signal: ac.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: fn, args: args.concat([k]) }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { clearTimeout(to); if (j && j.__err) { if (/암호/.test(j.__err)) { try { localStorage.removeItem('bb_k'); } catch (e) {} showSetup(); } fail && fail(new Error(j.__err)); } else ok && ok(j); })
      .catch(function (e) { clearTimeout(to); fail && fail(e); });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (_, name) {
      if (name === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (name === 'withFailureHandler') return function (f) { return runner(ok, f); };
      return function () { send(String(name), [].slice.call(arguments), ok, fail); };
    } });
  }
  window.google = { script: { run: runner(null, null) } };
  var shown = false;
  function showSetup() {
    if (shown) return; shown = true;
    var d = document.createElement('div'); d.className = 'setup';
    d.innerHTML = '<form class="card"><div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg></div><h1>암호를 넣어 주세요</h1><p>한 번 넣으면 이 기기가 기억해요</p><input autocomplete="off" autocapitalize="off" aria-label="암호"><button class="btn">열기</button></form>';
    document.body.appendChild(d);
    d.querySelector('form').addEventListener('submit', function (ev) { ev.preventDefault(); var v = d.querySelector('input').value.trim(); if (!v) return; try { localStorage.setItem('bb_k', v); } catch (e) {} location.reload(); });
  }
})();
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 1025 리뉴얼 — MJ 2026 디자인 철학: Linear 처럼 조용하게 · Toss 처럼 크게 · 데이터가 주인공 (#F5F6F8 · 흰 카드 · #155EEF · 20px · Pretendard · lucide)
   색 뜻: 노선 = 서울 버스 색(광역 빨강 · 간선 파랑 · 지선 초록) / 상태 = 초록 곧 도착 · 호박 거의 다 옴 · 회색 오는 중 */
:root{--bg:#F5F6F8;--card:#fff;--line:#EDEEF0;--line2:#E3E5E8;--ink:#111827;--ink2:#374151;--ink3:#6B7280;--pri:#155EEF;--pri-fill:#155EEF;--pri-bg:#EFF4FF;
  --ok:#067647;--ok-bg:#ECFDF3;--warn:#B54708;--warn-bg:#FFFAEB;--bad:#B42318;--bad-bg:#FEF3F2;
  --r-red:#D92D20;--r-blue:#2563EB;--r-green:#15803D;--r-gray:#6B7280;--sh:0 1px 3px rgba(0,0,0,.04);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0B0D12;--card:#151821;--line:#232734;--line2:#2C3141;--ink:#F3F4F6;--ink2:#D1D5DB;--ink3:#9CA3AF;--pri:#7AA2FF;--pri-fill:#2563EB;--pri-bg:#1A2440;
  --ok:#47CD89;--ok-bg:#0F2A1D;--warn:#FDB022;--warn-bg:#2D2210;--bad:#F97066;--bad-bg:#2E1513;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
.clock small.warn{color:var(--warn);font-weight:600}

.app{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(28px + env(safe-area-inset-bottom,0px))}
@media(min-width:840px){.app{padding:24px 28px 40px}}
/* 머리줄 */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;line-height:1.25}.top h1 #stop{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(min-width:840px){.top h1{font-size:24px}}
.top h1 .logo{width:34px;height:34px;border-radius:10px;background:var(--pri-fill);color:#fff;display:grid;place-items:center;flex:none}
.top h1 .logo .ic{width:20px;height:20px;stroke-width:1.8}
.top .sub{color:var(--ink3);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{text-align:right;line-height:1.1}
.clock b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.clock small{font-size:12px;color:var(--ink3)}
@media(min-width:840px){.clock b{font-size:22px}}
.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:none}
.ib.spin .ic{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* 코스 (Toss 식 분절 버튼) */
.seg{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1 1 0;min-height:44px;padding:0 8px;border:0;border-radius:12px;background:none;color:var(--ink3);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--pri-bg);color:var(--pri);font-weight:700}
/* 본문: 폰 = 한 줄 · 폴드 펼침·맥 = 큰 카드 | 목록 */
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}}
@media(min-width:760px) and (min-height:600px){   /* 폴드 펼침·맥북·전광판: 화면을 꽉 채움 (빈 공간 금지) */
 .app{display:flex;flex-direction:column;min-height:100dvh}
 #board{flex:1;display:flex;flex-direction:column}
 .grid{flex:1;align-items:stretch}
 .hero{display:flex;flex-direction:column}
 .hero .big{margin-top:auto}.hero .meta{margin-top:auto}
 .hero .big b{font-size:clamp(72px,min(34vh,22vw),320px)}
 .hero .big span{font-size:clamp(22px,4.5vh,40px)}
 .list{display:flex;flex-direction:column}.list .line{flex:1 1 0}
}
@media(min-width:1100px){.app{padding:24px 28px 20px}.line .txt b{font-size:18px}.line .val b{font-size:36px}.list .line .badge{height:40px;font-size:19px;width:112px}.hero{padding:28px}.hero .at{font-size:18px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.hero{padding:20px;cursor:pointer;position:relative;overflow:hidden}
.hero .row1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--bg);color:var(--ink2)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.go{background:var(--ok-bg);color:var(--ok)}.pill.soon{background:var(--warn-bg);color:var(--warn)}.pill.full{background:var(--bad-bg);color:var(--bad)}
.live{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3)}.live .ic{width:14px;height:14px}
.big{display:flex;align-items:baseline;gap:6px;margin:14px 0 2px}
.big b{font-size:72px;font-weight:800;letter-spacing:-.04em;line-height:1}
.big span{font-size:22px;font-weight:700;color:var(--ink2)}
.at{font-size:15px;color:var(--ink3)}.at b{color:var(--ink);font-weight:700}
.big.none b{font-size:30px;letter-spacing:-.01em}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;color:#fff;font-weight:800;font-size:19px;letter-spacing:-.01em;flex:none;background:var(--r-gray)}
.badge small{font-size:12px;font-weight:700;letter-spacing:0}
.b-red{background:var(--r-red)}.b-blue{background:var(--r-blue)}.b-green{background:var(--r-green)}
.dest{min-width:0;font-weight:600;font-size:15px}
.dest small{display:block;font-size:13px;font-weight:500;color:var(--ink3);margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
@media(max-width:400px){.chip .ic{display:none}}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 9px;border-radius:999px;background:var(--bg);font-size:13px;color:var(--ink2);font-weight:500}
.chip .ic{width:15px;height:15px;color:var(--ink3)}.chip b{color:var(--ink)}
.chip.seat0{background:var(--bad-bg);color:var(--bad)}
.hero.go .big b,.hero.go .big span{color:var(--ok)}.hero.soon .big b,.hero.soon .big span{color:var(--warn)}.hero.full .big b{color:var(--bad)}   /* 멀리서도 상태가 보이게 숫자 색 */
.fav-mark{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--pri);background:var(--pri-bg);border-radius:999px;padding:3px 9px}
.fav-mark .ic{width:13px;height:13px}
/* 목록 */
.list{padding:4px 0;overflow:hidden}
.line{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.line:first-child{border-top:0}
.line:hover{background:var(--bg)}
.line .txt{flex:1;min-width:0}
.line .txt b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .txt span{display:block;font-size:13px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .txt span .full{display:inline;color:var(--bad);font-weight:700}
.tag{display:inline-block;font-style:normal;font-size:11px;font-weight:700;color:var(--ink3);border:1px solid var(--line2);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px}
.line .val{text-align:right;flex:none}
.line .val b{font-size:26px;font-weight:800;letter-spacing:-.02em}.line .val b small{font-size:15px;font-weight:700;margin-left:1px}
.line .val span{display:block;font-size:12px;color:var(--ink3)}
.line .val.none{font-size:13px;font-weight:600;color:var(--ink3)}
.line.go .val b{color:var(--ok)}.line.soon .val b{color:var(--warn)}
.line.extra .txt b,.line.extra .val b{color:var(--ink3)}.line.wait .val b{color:var(--ink3)}
.line .badge{height:32px;font-size:16px;padding:0 10px;width:96px;justify-content:center}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--ink3)}
/* 상태 · 빈 화면 */
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;margin-top:14px;border:0;border-radius:999px;background:var(--pri-fill);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.skel{background:linear-gradient(90deg,var(--line) 0,var(--bg) 50%,var(--line) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}
.stale .hero,.stale .list{opacity:.55}
.foot{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink3);font-size:12px;margin-top:16px;text-align:center;flex-wrap:wrap}
.foot .ic{width:14px;height:14px}
.slide-l{animation:sl .22s ease}.slide-r{animation:sr .22s ease}
@keyframes sl{from{transform:translateX(24px);opacity:.4}}@keyframes sr{from{transform:translateX(-24px);opacity:.4}}
/* 당겨서 새로고침 */
.ptr{position:fixed;left:50%;top:0;transform:translate(-50%,-40px);z-index:50;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.12);display:grid;place-items:center;color:var(--ink3);opacity:0;transition:opacity .15s}
.ptr.show{opacity:1}.ptr.ready{color:var(--pri)}.ptr.spin .ic{animation:spin .9s linear infinite}
/* 암호 화면 */
.setup{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;padding:24px}
.setup form{width:min(360px,100%);padding:28px}
.setup .logo{width:44px;height:44px;border-radius:12px;background:var(--pri-fill);color:#fff;display:grid;place-items:center}
.setup h1{font-size:22px;margin:16px 0 4px}.setup p{color:var(--ink3);margin:0 0 16px}
.setup input{width:100%;height:52px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);font-size:20px;text-align:center;letter-spacing:.2em;color:var(--ink)}
.setup .btn{width:100%}
@media(max-width:380px){.big b{font-size:60px}.top h1{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ptr" id="ptr" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></div>
<div class="app">
  <header class="top">
    <div class="tt"><h1><span class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg></span><span id="stop">불러오는 중…</span></h1>
      <div class="sub" id="course"></div></div>
    <div class="clock"><b class="num" id="clock">--:--</b><small id="age"></small></div>
    <button type="button" class="ib" id="refresh" aria-label="새로고침"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </header>
  <nav class="seg" id="tabs" aria-label="코스"></nav>
  <main id="board"></main><div id="toast" class="toast" role="status"></div>
  <footer class="foot"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span id="footText"></span></footer>
</div>
<script>
  var REFRESH = 30000, STALE = 45000, OLD = 75;      // OLD 초 넘으면 화면을 바래게
  var current = null, commutes = [], cache = {}, pending = {}, fetchedAt = 0, offline = false, prefetched = false;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() { var d = new Date(); $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function setSpin(on) { $('refresh').classList.toggle('spin', !!on); }
  $('footText').textContent = '시간은 버스가 정류장에 오는 시각 · 버스를 누르면 맨 위에 고정돼요';
  var I = {
    clock: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    stops: '<svg class="ic" viewBox="0 0 24 24"><path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>',
    next: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
    seat: '<svg class="ic" viewBox="0 0 24 24"><path d="M7 18v3"/><path d="M17 18v3"/><path d="M5 11V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v5"/><path d="M3 11h18v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    pin: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>',
    live: '<svg class="ic" viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>'
  };
  function ageTick() {
    var el = $('age'); if (!fetchedAt) { el.textContent = ''; return; }
    var s = Math.floor((Date.now() - fetchedAt) / 1000);
    el.textContent = (s < 10 ? '방금 받음' : s < 60 ? s + '초 전' : Math.floor(s / 60) + '분 전') + (offline ? ' · 연결 끊김' : s > OLD ? ' · 오래됨' : '');
    el.classList.toggle('warn', s > OLD || offline);
